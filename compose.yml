services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: study_planner
      POSTGRES_USER: study_planner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_planner -d study_planner"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/study_planner
      DB_USERNAME: study_planner
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_QUIZ_MODEL: ${OPENAI_QUIZ_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
